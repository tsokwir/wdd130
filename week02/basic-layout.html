<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Okwir Samuel">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="course logo" width="128" height="128">

            <li><a href="https://www.churchofjesuschrist.org">Church Website</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading one</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Cumque, tenetur!</p>
        </section>
        <section>
            <h2>Heading two</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
        </section>
    </main>
    <aside>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/albuquerque-new-mexico/800x800/albuquerque-temple-lds-820684-wallpaper.jpg" alt="Temple image" width="200">

    <footer>
        <p>Okwir Samuel</p>
    </footer>

</html>
