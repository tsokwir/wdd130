<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting Company for information, reservations, and questions.">
    <meta name="author" content="Okwir Samuel">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="company-heading">
            <h1>White Water Rafting Company</h1>

            <p>
                <strong>Murchison Falls National Park</strong><br>
                <strong>Uganda</strong><br>
                <strong>+25631 2355000</strong><br>
                <strong>info@whitewater.com</strong>
            </p>
        </section>

        <section class="contact-container">

            <!-- Google Map -->
            <div class="contact-map">
                <iframe src="https://maps.google.com/maps?q=Murchison%20Falls%20National%20Park%2C%20Uganda&t=&z=12&ie=UTF8&iwloc=&output=embed" title="Murchison Falls National Park, Uganda" width="100%" height="250" loading="lazy">
                </iframe>
            </div>

            <!-- Contact Form -->
            <div class="contact-form">

                <form action="#" method="post">

                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder" required>
                    </div>

                    <fieldset class="purpose">
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>

                    </fieldset>

                    <div class="message-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here..." required></textarea>
                    </div>

                    <div class="subscribe">
                        <label for="subscribe">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>

        <!-- Employee Profiles -->
        <section class="employee-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.jpg" alt="Company manager">
                    <figcaption>Company Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Lead river guide">
                    <figcaption>Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer service officer">
                    <figcaption>Customer Service Officer</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>© 2026 White Water Rafting | Okwir Samuel</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>
        </nav>

    </footer>

</body>

</html>
